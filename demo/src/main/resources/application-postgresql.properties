# PostgreSQL Configuration FORCÉE
spring.datasource.url=jdbc:postgresql://localhost:5432/comite_ethique
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Dialect et optimisations
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Connection Pool PostgreSQL optimisé
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# PostgreSQL Performance
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Flyway PostgreSQL - DISABLED
spring.flyway.enabled=false

# JPA DDL Auto pour PostgreSQL
spring.jpa.hibernate.ddl-auto=update

# Logging PostgreSQL
logging.level.org.postgresql=INFO
logging.level.com.zaxxer.hikari=INFO

# Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB