spring.application.name=comite-ethique
server.port=8082

# H2 Database Configuration for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Disable Flyway for testing
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=myVerySecureSecretKeyForJWTTokenGeneration123456789012345678901234567890
jwt.access-token-validity=15
jwt.refresh-token-validity=7

# Disable mail for testing
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.comite.demo=DEBUG
logging.level.org.springframework.security=INFO