# Configuration de production avec PostgreSQL
spring.application.name=comite-ethique-prod

# Database Configuration PostgreSQL pour production
spring.datasource.url=jdbc:postgresql://localhost:5432/comite_ethique
spring.datasource.username=comite_user
spring.datasource.password=comite_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration pour production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Logging pour production
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
logging.level.root=INFO