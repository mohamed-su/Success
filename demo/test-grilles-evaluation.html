<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Grilles d'Évaluation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .btn { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .grid-item { border: 1px solid #ddd; margin: 10px 0; padding: 15px; border-radius: 5px; }
        .status-completed { background-color: #d4edda; }
        .status-pending { background-color: #fff3cd; }
    </style>
</head>
<body>
    <h1>Test Grilles d'Évaluation</h1>
    
    <div>
        <label>ID du Protocole: </label>
        <input type="number" id="protocolId" value="1" />
        <button class="btn" onclick="getEvaluationGrids()">Grilles d'Évaluations</button>
    </div>
    
    <div id="results"></div>

    <script>
        async function getEvaluationGrids() {
            const protocolId = document.getElementById('protocolId').value;
            const resultsDiv = document.getElementById('results');
            
            try {
                const response = await fetch(`http://localhost:8081/api/evaluation/protocol/${protocolId}/grids`);
                const data = await response.json();
                
                if (data.success) {
                    let html = `<h3>Grilles d'Évaluation (${data.count})</h3>`;
                    
                    if (data.grids.length === 0) {
                        html += '<p>Aucune grille d\'évaluation trouvée pour ce protocole.</p>';
                    } else {
                        data.grids.forEach(grid => {
                            html += `
                                <div class="grid-item status-${grid.status.toLowerCase()}">
                                    <h4>Évaluateur: ${grid.memberName || 'Non défini'}</h4>
                                    <p><strong>Statut:</strong> ${grid.status}</p>
                                    <p><strong>Score moyen:</strong> ${grid.averageScore ? grid.averageScore.toFixed(2) : 'Non calculé'}/5</p>
                                    <p><strong>Décision:</strong> ${grid.decision || 'En attente'}</p>
                                    <p><strong>Assigné le:</strong> ${new Date(grid.assignedAt).toLocaleDateString()}</p>
                                    ${grid.completedAt ? `<p><strong>Complété le:</strong> ${new Date(grid.completedAt).toLocaleDateString()}</p>` : ''}
                                    ${grid.generalComments ? `<p><strong>Commentaires:</strong> ${grid.generalComments}</p>` : ''}
                                </div>
                            `;
                        });
                    }
                    
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = `<p style="color: red;">Erreur: ${data.error}</p>`;
                }
            } catch (error) {
                resultsDiv.innerHTML = `<p style="color: red;">Erreur de connexion: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
